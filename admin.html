
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<link rel="stylesheet" href="welcome.css">
<link rel="stylesheet" href="perfil.css">
</head>
<body>
<main class="content">
  <section class="perfil-card">
    <h2>NOVA NOTÍCIA (ADMIN)</h2>
    <label>Chave admin</label>
    <input type="password" id="admin-key" style="width:100%;padding:8px;margin-bottom:10px;">
    <label>Título</label>
    <input type="text" id="post-title" style="width:100%;padding:8px;margin-bottom:10px;">
    <label>Texto</label>
    <textarea id="post-content" style="width:100%;padding:8px;margin-bottom:10px;" rows="4"></textarea>
    <label>URL de imagem (opcional)</label>
    <input type="text" id="post-image" style="width:100%;padding:8px;margin-bottom:10px;">
    <button id="publish-btn" style="width:100%;padding:10px;border:none;border-radius:25px;background:#e1817a;color:white;cursor:pointer;">PUBLICAR</button>
    <p id="admin-msg"></p>
  </section>
</main>
<script>
document.getElementById('publish-btn').addEventListener('click', async () => {
  const key = document.getElementById('admin-key').value;
  const title = document.getElementById('post-title').value;
  const content = document.getElementById('post-content').value;
  const image_url = document.getElementById('post-image').value;
  const msg = document.getElementById('admin-msg');

  try {
    const res = await fetch('http://localhost:3000/posts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
      body: JSON.stringify({ title, content, image_url })
    });
    const data = await res.json();
    msg.style.color = res.ok ? 'green' : 'red';
    msg.textContent = res.ok ? data.message : data.error;
  } catch (err) {
    msg.style.color = 'red';
    msg.textContent = 'Erro de ligação.';
  }
});
</script>

<section class="perfil-card" style="margin-top:20px;">
  <h2>GERIR UTILIZADORES</h2>
  <input type="password" id="admin-key-users" placeholder="Chave admin" style="width:100%;padding:8px;margin-bottom:10px;">
  <button onclick="loadUsers()" style="width:100%;padding:10px;border:none;border-radius:25px;background:#e1817a;color:white;">CARREGAR UTILIZADORES</button>
  <div id="users-list"></div>
</section>
<script>
async function loadUsers() {
  const key = document.getElementById('admin-key-users').value;
  const res = await fetch('http://localhost:3000/admin/users', { headers: { 'x-admin-key': key } });
  const users = await res.json();
  const listEl = document.getElementById('users-list');
  if (!res.ok) { listEl.innerHTML = `<p>${users.error}</p>`; return; }
  listEl.innerHTML = users.map(u => `
    <p>${u.email} ${u.banned ? '(BANIDO)' : ''}
    <button onclick="toggleBan('${u.email}', ${u.banned}, '${key}')">${u.banned ? 'Reativar' : 'Banir'}</button></p>
  `).join('');
}
async function toggleBan(email, isBanned, key) {
  const endpoint = isBanned ? 'unban' : 'ban';
  await fetch(`http://localhost:3000/admin/users/${encodeURIComponent(email)}/${endpoint}`, {
    method: 'POST',
    headers: { 'x-admin-key': key }
  });
  loadUsers();
}
</script>
</body>
